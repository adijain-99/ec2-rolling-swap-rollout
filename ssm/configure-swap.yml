# GENERATED by scripts/build-ssm-document.sh from scripts/configure-swap.sh.
# Do not edit by hand: change the script and re-run `make ssm-doc`.
---
schemaVersion: "2.2"
description: >-
  Idempotently add a swap file and set vm.swappiness on Amazon Linux /
  RHEL-family / Ubuntu hosts. No reboot required. Safe to re-run.
parameters:
  SwapSizeMiB:
    type: String
    description: Swap file size in MiB.
    default: "8192"
    allowedPattern: "^[0-9]{3,6}$"
  Swappiness:
    type: String
    description: Value for vm.swappiness (0-200).
    default: "10"
    allowedPattern: "^([0-9]|[1-9][0-9]|1[0-9][0-9]|200)$"
mainSteps:
  - action: aws:runShellScript
    name: configureSwap
    precondition:
      StringEquals:
        - platformType
        - Linux
    inputs:
      timeoutSeconds: "1800"
      runCommand:
        - |
          export SWAP_SIZE_MIB='{{ SwapSizeMiB }}'
          export SWAPPINESS='{{ Swappiness }}'
          cat > /tmp/configure-swap.sh <<'SCRIPT'
          #!/usr/bin/env bash
          #
          # configure-swap.sh — idempotently add a swap file and tune vm.swappiness.
          #
          # Safe to re-run: each step checks current state and only changes what is
          # missing. No reboot or service restart is required.
          #
          # Steps:
          #   1. Create the swap file with dd (O_DIRECT, so the page cache is not
          #      flooded on a host that is already short of memory). Mode 0600 from
          #      the moment it exists.
          #   2. mkswap + swapon.
          #   3. Add a single /etc/fstab entry (backed up first; validated; restored
          #      automatically if validation fails).
          #   4. Persist vm.swappiness in /etc/sysctl.d and apply it live.
          #
          # Configuration (environment variables):
          #   SWAP_FILE              Path of the swap file            (default: /swapfile)
          #   SWAP_SIZE_MIB          Size of the swap file in MiB     (default: 8192)
          #   SWAPPINESS             vm.swappiness value              (default: 10)
          #   MIN_FREE_HEADROOM_MIB  Free disk to keep after creation (default: 2048)
          #   SYSCTL_FILE            sysctl drop-in path              (default: /etc/sysctl.d/99-swap.conf)
          #
          # Exit codes:
          #   0  swap configured (or already configured)
          #   1  a step failed; the host is left in its previous, working state
          #   2  usage / environment error

          set -Eeuo pipefail

          SWAP_FILE="${SWAP_FILE:-/swapfile}"
          SWAP_SIZE_MIB="${SWAP_SIZE_MIB:-8192}"
          SWAPPINESS="${SWAPPINESS:-10}"
          MIN_FREE_HEADROOM_MIB="${MIN_FREE_HEADROOM_MIB:-2048}"
          SYSCTL_FILE="${SYSCTL_FILE:-/etc/sysctl.d/99-swap.conf}"
          FSTAB_LINE="${SWAP_FILE} none swap sw 0 0"

          log() { printf '%s [configure-swap] %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$*"; }
          die() { log "ERROR $*"; exit 1; }

          on_error() {
            local rc=$?
            log "ERROR line ${BASH_LINENO[0]}: '${BASH_COMMAND}' exited ${rc}"
            exit 1
          }
          trap on_error ERR

          if [[ "${1:-}" == "-h" || "${1:-}" == "--help" ]]; then
            sed -n '3,28p' "$0" | sed 's/^# \{0,1\}//'
            exit 0
          fi

          [[ $EUID -eq 0 ]] || { log "ERROR must run as root"; exit 2; }
          [[ "$SWAP_SIZE_MIB" =~ ^[0-9]+$ ]] || { log "ERROR SWAP_SIZE_MIB must be an integer"; exit 2; }
          if ! [[ "$SWAPPINESS" =~ ^[0-9]+$ ]] || (( SWAPPINESS > 200 )); then
            log "ERROR SWAPPINESS must be 0-200"; exit 2
          fi

          swap_is_active() { swapon --show=NAME --noheadings | grep -qx "$SWAP_FILE"; }

          # --- 1. Create the swap file -------------------------------------------------
          expected_bytes=$((SWAP_SIZE_MIB * 1024 * 1024))

          if swap_is_active; then
            log "Swap already active on ${SWAP_FILE}; skipping creation"
          else
            if [[ -e "$SWAP_FILE" ]]; then
              actual_bytes="$(stat -c %s "$SWAP_FILE")"
              if [[ "$actual_bytes" != "$expected_bytes" ]]; then
                die "${SWAP_FILE} exists with unexpected size ${actual_bytes} bytes; refusing to overwrite"
              fi
              log "${SWAP_FILE} exists with expected size; reusing it"
            else
              avail_mib="$(df --output=avail -m "$(dirname "$SWAP_FILE")" | tail -n 1 | tr -d ' ')"
              required_mib=$((SWAP_SIZE_MIB + MIN_FREE_HEADROOM_MIB))
              (( avail_mib >= required_mib )) \
                || die "only ${avail_mib} MiB free, need ${required_mib} MiB"

              log "Creating ${SWAP_FILE} (${SWAP_SIZE_MIB} MiB) with dd oflag=direct"
              # umask 077 => file is 0600 from creation; no world-readable window.
              # dd (not fallocate) because swapon rejects files with unwritten extents
              # on some XFS/kernel combinations.
              (
                umask 077
                dd if=/dev/zero of="$SWAP_FILE" bs=1M count="$SWAP_SIZE_MIB" \
                   oflag=direct status=none
              ) || { rm -f "$SWAP_FILE"; die "dd failed; partial file removed"; }
            fi

            chmod 600 "$SWAP_FILE"
            chown root:root "$SWAP_FILE"

            # mkswap only if the file has no swap signature yet
            if ! blkid -p -s TYPE -o value "$SWAP_FILE" 2>/dev/null | grep -qx swap; then
              log "Formatting ${SWAP_FILE} as swap"
              mkswap "$SWAP_FILE" >/dev/null
            fi

            log "Enabling swap on ${SWAP_FILE}"
            swapon "$SWAP_FILE"
          fi

          # --- 2. Persist in /etc/fstab -----------------------------------------------
          if grep -Eq "^[[:space:]]*${SWAP_FILE}[[:space:]]+[^[:space:]]+[[:space:]]+swap" /etc/fstab; then
            log "/etc/fstab already has a swap entry for ${SWAP_FILE}"
          else
            backup="/etc/fstab.bak.$(date -u +%Y%m%dT%H%M%SZ)"
            cp -p /etc/fstab "$backup"
            log "Backed up /etc/fstab to ${backup}"
            printf '%s\n' "$FSTAB_LINE" >> /etc/fstab

            if ! { mount -a && swapon -a; }; then
              cp -p "$backup" /etc/fstab
              die "fstab validation failed; restored ${backup}"
            fi
            log "Added and validated fstab entry: ${FSTAB_LINE}"
          fi

          # --- 3. Swappiness ------------------------------------------------------------
          desired="vm.swappiness=${SWAPPINESS}"
          if [[ -f "$SYSCTL_FILE" ]] && grep -qx "$desired" "$SYSCTL_FILE"; then
            log "${SYSCTL_FILE} already sets ${desired}"
          else
            printf '# Managed by ec2-rolling-swap-rollout\n%s\n' "$desired" > "$SYSCTL_FILE"
            log "Wrote ${desired} to ${SYSCTL_FILE}"
          fi
          sysctl -q -p "$SYSCTL_FILE"

          # --- Result ----------------------------------------------------------------------
          log "Done. swappiness=$(cat /proc/sys/vm/swappiness)"
          swapon --show
          free -h
          SCRIPT
          bash /tmp/configure-swap.sh
          rc=$?
          rm -f /tmp/configure-swap.sh
          exit $rc
